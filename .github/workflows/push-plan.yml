name: Push training plan to Intervals.icu

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Plan file to send"
        required: true
        default: "plan-automne-2026.json"
      prune:
        description: "Retirer du calendrier les séances du plan qui n'y figurent plus (aujourd'hui et après)"
        type: boolean
        default: false
      dry_run:
        description: "Simulation only (send nothing, delete nothing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Push plan
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          PLAN_FILE: ${{ inputs.plan_file }}
          PRUNE: ${{ inputs.prune }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python push_plan.py
